services:
  postgres:
    image: postgres:17
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: bankingman
      POSTGRES_PASSWORD: banking_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: