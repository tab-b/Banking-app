services:
  postgres:
    image: postgres:17
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: bankingman
      POSTGRES_PASSWORD: banking_dev_password

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17
    container_name: banking-postgres-test
    environment:
      POSTGRES_DB: banking_test
      POSTGRES_USER: banking_test
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
volumes:
  postgres_data:
  postgres_test_data: